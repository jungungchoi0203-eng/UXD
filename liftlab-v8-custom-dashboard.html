/* LiftLab crimson edition: home and progress are one continuous dashboard. */
:root{--red:#ff4358;--red-ink:#27060c;--blue:#ff665e;--pink:#ff8c9a}
body{background:radial-gradient(ellipse at 80% 0%,rgba(129,20,38,.09),transparent 44%),#0c0d11}
.brand-symbol,.mini-mark{background:linear-gradient(140deg,#ff6571,#d91e3c);color:#fff;box-shadow:0 5px 21px #ff435825}
.brand-notch{background:#7f1223}
.button-primary{background:linear-gradient(130deg,#ff5367,#ed2646);color:#fff;box-shadow:0 5px 20px #c81e3028}
.button-primary:hover{background:linear-gradient(130deg,#ff7687,#ff3d5b)}
.button-blue,.button-pink{background:#f24a5d;color:#fff}
.button-blue:hover,.button-pink:hover{background:#ff6b7b}
.nav-item.is-active{background:#2a171c;color:#fff;border-color:#56252f;box-shadow:inset 3px 0 0 var(--red)}
.nav-item.is-active svg{color:var(--red)}
.hero{border-color:#572932;background:radial-gradient(ellipse at 88% 2%,#5d1d33 0%,transparent 66%),linear-gradient(115deg,#30141e,#1c1319 66%,#151318)}
.hero:after{color:#ff5169;opacity:.10}
.hero-kicker,.hero p{color:#d6aab4}
.hero-art .ring{border-color:#ff5e70}
.hero-art svg{stroke:#ff667c}
.explore-card{border-color:#6b303d;background:radial-gradient(ellipse at 88% 14%,#5f2031,transparent 60%),linear-gradient(130deg,#2d1521,#1b1419)}
.explore-card.bodybuild{border-color:#622b3b;background:radial-gradient(ellipse at 85% 11%,#63263c,transparent 60%),linear-gradient(130deg,#321725,#191419)}
.program-cover{background:radial-gradient(ellipse at 80% 10%,#6f2538,transparent 70%),linear-gradient(120deg,#301825,#170f17)}
.program-card.pink .program-cover{background:radial-gradient(ellipse at 80% 10%,#703248,transparent 70%),linear-gradient(120deg,#381728,#1b121a)}
.home-progress{margin-top:42px;padding-top:10px;scroll-margin-top:24px}
.home-progress .head-row{margin-bottom:21px}
.progress-heading{font-family:var(--display);font-size:clamp(25px,3.2vw,38px);font-weight:850;letter-spacing:-1.5px;margin:8px 0 7px;line-height:1.12}
.home-progress .metric-row{margin-bottom:17px}
.home-progress .chart-card{margin-bottom:18px}
.home-progress>.section-heading{margin-top:26px}
.home-progress .history-row strong{color:#e9edf1}
@media(max-width:700px){.home-progress{margin-top:32px}.home-progress .head-row{align-items:flex-start}.home-progress .metric-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.home-progress .metric{padding:14px 11px}.home-progress .metric strong{font-size:clamp(17px,4.6vw,24px)}.home-progress .metric .label{font-size:9px}.home-progress .chart-card{padding:17px}}

/* V3: full category labels on small mobile navigation. */
@media(max-width:900px){.mobile-nav button{flex:1;min-width:0;padding:0 2px}.mobile-nav small{font-size:clamp(9px,2.45vw,11px);white-space:nowrap}}

/* V4 · IPF meet-results percentile panel and one-tap PR editing */
.stat-editable{display:block;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.stat-editable:hover,.stat-editable:focus-visible{border-color:#df5268;transform:translateY(-2px);outline:none}
.stat-editable .label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-pencil{display:inline-flex;align-items:center;justify-content:center;color:#f77c90;opacity:.9}
.ipf-panel{padding:26px;margin-top:22px;border:1px solid #51303a;background:linear-gradient(135deg,rgba(62,27,37,.44),#16191e 50%)}
.ipf-heading{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px}
.ipf-heading h2{font-family:var(--display);font-size:clamp(23px,2.4vw,31px);line-height:1.1;letter-spacing:-1.1px;margin:9px 0 8px}
.ipf-heading p{margin:0;font-size:12px;line-height:1.65;color:#9aa6b5;max-width:570px}
.ipf-heading p strong{font-weight:700;color:#d5dce2}
.ipf-heading>.button{flex-shrink:0}
.ipf-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.ipf-score{padding:18px;border:1px solid #383039;border-radius:13px;background:#191c23;min-width:0;min-height:140px;display:flex;flex-direction:column;gap:7px}
.ipf-score>span{font-size:10px;letter-spacing:1.25px;font-weight:800;color:#a7a0ac}
.ipf-score>strong{display:block;font:850 clamp(25px,3vw,37px)/1.08 var(--display);letter-spacing:-1px;color:#fff;margin-top:6px;overflow-wrap:anywhere}
.ipf-score:first-child>strong{color:#ff6479}
.ipf-score>strong em{font-size:12px;letter-spacing:0;color:#aab0ba;font-style:normal}
.ipf-score>strong.ipf-division{font-size:clamp(16px,2vw,22px);letter-spacing:-.4px;line-height:1.3}
.ipf-score>small{font-size:10px;color:#9399a5;line-height:1.5;margin-top:auto}
.ipf-ranking{margin-top:21px;padding:22px 22px 10px;background:#11151b;border:1px solid #34313a;border-radius:13px}
.ipf-ranking-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:19px}
.ipf-ranking-title strong{font-size:14px}
.ipf-ranking-title>span{font-size:10px;color:#95909c}
.rank-row{margin-bottom:18px}
.rank-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:11px}
.rank-top strong{color:#d9dce3;font-size:12px}
.rank-top span{color:#a7a3ad;font-size:11px;text-align:right}
.rank-top span b{color:#ff778c}
.rank-track{background:#2c252e;border-radius:40px;height:7px;overflow:hidden}
.rank-track>div{background:linear-gradient(90deg,#b71f3d,#ff6078);height:100%;border-radius:40px;transition:width .25s}
.ipf-no-data{margin:18px 0 0;background:#27202a;border:1px solid #48313e;border-radius:12px;padding:15px;color:#b6abb5;font-size:12px;display:flex;gap:11px;align-items:center;line-height:1.6}
.ipf-no-data strong{color:#f6e4e9}
.ipf-no-data svg{color:#ff8190;flex-shrink:0}
.ipf-footer{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:21px;padding-top:18px;border-top:1px solid #3a3039}
.ipf-footer p{color:#9895a2;font-size:11px;line-height:1.65;margin:0;max-width:690px}
.ipf-footer p strong{color:#dad0d6}
.ipf-footer .button{flex-shrink:0}
.ipf-instructions{display:grid;gap:13px;margin-bottom:22px;border-radius:12px;border:1px solid #4b3340;background:#241e27;padding:17px;font-size:12px;line-height:1.6;color:#c4b8c1}
.ipf-instructions>div{display:flex;gap:10px;align-items:start}
.ipf-instructions b{color:#ff6d83}
.ipf-instructions a{color:#ff90a0;text-underline-offset:3px}
@media(max-width:850px){.ipf-heading{flex-wrap:wrap}.ipf-footer{flex-wrap:wrap}.ipf-overview{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){.ipf-panel{padding:17px;margin-top:15px}.ipf-heading h2{font-size:25px}.ipf-heading>.button{width:100%;justify-content:center}.ipf-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.ipf-score:last-child{grid-column:span 2;min-height:106px}.ipf-score{padding:13px;min-height:122px}.ipf-score>strong{font-size:28px}.ipf-ranking{padding:16px 13px 1px}.ipf-ranking-title{align-items:start;flex-direction:column;gap:4px}.ipf-footer .button{width:100%;justify-content:center}}

/* Profile-save reliability: explicit errors, accessible save control, and storage feedback. */
.profile-form-error{border:1px solid #e55c70;border-radius:10px;background:#4e1c2a;color:#ffd9e0;padding:12px 14px;font-size:12px;font-weight:700;margin-top:18px;line-height:1.5}
.profile-form-error[hidden]{display:none}
.profile-save-actions{position:sticky;bottom:-26px;z-index:2;background:linear-gradient(0deg,#161a20 77%,rgba(22,26,32,.96));padding:14px 0 17px;margin-bottom:-23px;border-top:1px solid #333840}
.local-chip.storage-warning{border-color:#b74c5e;color:#ffb7c3;background:#381922}
@media(max-width:650px){.profile-save-actions .button{flex:1;min-width:130px}.modal{padding-bottom:24px}}

/* V6 direct-record entry + restrained actions */
.sidebar-bottom{margin-top:auto}
.stats-grid.pr-input-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pr-editor{margin:24px 0 18px}
.pr-editor-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.pr-editor-head h2{font:800 24px/1.2 var(--display);letter-spacing:-.7px;margin:5px 0 5px}
.pr-editor-head p{font-size:12px;color:#949da9;line-height:1.5;margin:0}
.pr-edit-card{display:block;cursor:text;min-width:0}
.pr-edit-card .label{display:block;color:#afb6c0;font-size:11px;font-weight:800;letter-spacing:1px}
.pr-field{display:flex;align-items:baseline;gap:8px;margin:13px 0 7px}
.pr-home-input{width:100%;min-width:0;color:#fff;font:800 clamp(23px,3vw,36px)/1.2 var(--display);background:transparent;border:0;border-bottom:2px solid #44414b;border-radius:0;padding:2px 0 8px;outline:none;appearance:textfield;-moz-appearance:textfield}

.pr-home-input:focus{outline:none;border-color:var(--red);background:rgba(255,67,88,.055)}
.pr-field span{font:700 12px var(--sans);color:#9fa5ae}
.pr-edit-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}
.pr-save-status{font-size:12px;color:#a3aeb9;line-height:1.5}
.pr-save-error{font-size:12px;color:#ffb9c5;margin-top:6px}
.pr-save-error[hidden]{display:none}
.pr-save-button{min-width:145px;justify-content:center}
.single-cockpit{grid-template-columns:1fr}
.single-cockpit>.feature-card{min-height:210px}
.topbar-right{gap:10px}
@media(max-width:700px){.stats-grid.pr-input-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pr-editor-head h2{font-size:21px}.pr-edit-card{padding:14px 12px}.pr-home-input{font-size:24px}.pr-field{gap:4px}.pr-field span{font-size:10px}.pr-edit-footer{flex-direction:column;align-items:stretch}.pr-save-button{width:100%}}
@media(max-width:420px){.pr-home-input{font-size:22px}.stats-grid.pr-input-grid{gap:6px}.pr-edit-card{padding:12px 9px}.pr-edit-card .label{font-size:9px}}

.data-backup-disclosure{margin-top:29px;padding:16px 18px;background:#14171c;border:1px solid #292d35;border-radius:12px}
.data-backup-disclosure summary{cursor:pointer;color:#acb5c1;font-size:12px;font-weight:700}
.data-backup-disclosure[open] summary{color:#fff;margin-bottom:10px}
.backup-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backup-controls button{font-size:11px}

/* V7: show actual bodyweight separately from IPF category upper bound. */
.ipf-score small b{color:#e8c6cd;font-weight:750}
.ipf-cohort-note{font-size:11px;color:#adb0b9;line-height:1.65;margin:-5px 0 21px;max-width:660px}


/* V8: reorderable dashboard cards */

};
function icon(name, size = 18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${E[name]||E.info}</svg>`;}
function installIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon);});}
const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const roundPlate=(n)=>Math.round(n/5)*5;
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayISO=()=>new Date().toISOString().slice(0,10);
const PR_NAMES={squat:'Squat',bench:'Bench press',deadlift:'Deadlift',ohp:'Overhead press'};
const IPF_DATA_KEY='liftlab-openipf-cohorts-v1';
const IPF_SOURCE='https://openpowerlifting.gitlab.io/opl-csv/files/openipf-latest.zip';
const LB_PER_KG=2.2046226218;
const IPF_COEFFICIENTS={M:[1199.72839,1025.18162,0.00921],F:[610.32796,1045.59282,0.03048]};
// 2026 IPF bodyweight classes, expressed as upper class limits in kg.
const IPF_CLASSES={M:[53,59,66,74,83,93,105,120,Infinity],F:[43,47,52,57,63,69,76,84,Infinity]};
function ipfAgeGroup(age){age=Number(age);if(!Number.isFinite(age)||age<14||age>100)return null;if(age<=18)return 'Sub-junior (14–18)';if(age<=23)return 'Junior (19–23)';if(age<40)return 'Open (24–39)';if(age<50)return 'Master I (40–49)';if(age<60)return 'Master II (50–59)';if(age<70)return 'Master III (60–69)';return 'Master IV (70+)';}
function ipfWeightClass(kg,sex,age){if(!(kg>0)||!IPF_CLASSES[sex])return null;let values=IPF_CLASSES[sex];if(age>=24)values=values.slice(1);const n=values.find(v=>kg<=v)??Infinity;return n===Infinity?(sex==='M'?'120+ kg':'84+ kg'):`${n} kg`;}
function ipfClassRange(kg,sex,age){
 const label=ipfWeightClass(kg,sex,age);
 if(!label||!IPF_CLASSES[sex])return '';
 const limits=IPF_CLASSES[sex],upper=parseFloat(label),idx=limits.findIndex(value=>value===upper);
 if(!Number.isFinite(upper))return `over ${limits[limits.length-2]} kg`;
 if(idx<=0||(age>=24&&idx===1))return `up to ${upper} kg`;
 return `over ${limits[idx-1]} to ${upper} kg`;
}
function ipfCohortKey(sex,age,kg){const group=ipfAgeGroup(age),category=ipfWeightClass(kg,sex,age);return group&&category?`${sex}|${group}|${category}`:null;}
function ipfGL(profile){const kg=Number(profile.bodyweightLb)/LB_PER_KG,sex=profile.sex,pr=profile.prs;if(!IPF_COEFFICIENTS[sex]||!(kg>0))return null;const total=(Number(pr.squat)||0)+(Number(pr.bench)||0)+(Number(pr.deadlift)||0);if(!(Number(pr.squat)>0&&Number(pr.bench)>0&&Number(pr.deadlift)>0))return null;const [a,b,c]=IPF_COEFFICIENTS[sex];const divisor=a-b*Math.exp(-c*kg);return divisor>0?total/LB_PER_KG*100/divisor:null;}
function ipfReferenceLoad(){try{const data=JSON.parse(localStorage.getItem(IPF_DATA_KEY));return data&&data.version===1&&data.cohorts&&typeof data.cohorts==='object'?data:null;}catch{return null;}}
function ipfPercentile(cohort,lift,lb){if(!cohort||!(lb>0)||!cohort[lift])return null;const sample=cohort[lift];if(!sample.n||sample.n<30)return null;const target=lb/LB_PER_KG/2.5;let below=0,equal=0;for(const [bin,count] of sample.hist){if(bin<target-0.00001)below+=count;else if(Math.abs(bin-target)<0.00001)equal+=count;}return {pct:(below+equal*.5)/sample.n,n:sample.n};}
function ipfSummary(){const p=state.profile,kg=Number(p.bodyweightLb)/LB_PER_KG,key=ipfCohortKey(p.sex,Number(p.age),kg),cohort=ipfReference?.cohorts?.[key];return {kg,key,cohort,gl:ipfGL(p),ageGroup:ipfAgeGroup(Number(p.age)),weightClass:ipfWeightClass(kg,p.sex,Number(p.age))};}
function rankingRow(label,lift,value,cohort){const ranked=ipfPercentile(cohort,lift,value);return `<div class="rank-row"><div class="rank-top"><strong>${label}</strong><span>${ranked?`<b>${ranked.pct.toFixed(1)} percentile</b> · n=${fmt(ranked.n)}`:'Awaiting comparable results'}</span></div><div class="rank-track"><div style="width:${ranked?ranked.pct:0}%"></div></div></div>`;}
function renderIPFPanel(){const p=state.profile,s=ipfSummary(),hasProfile=Boolean(s.key);const pr=p.prs,total=Number(pr.squat)+Number(pr.bench)+Number(pr.deadlift);return `<section class="ipf-panel panel" aria-label="IPF competition comparison"><div class="ipf-heading"><div><div class="eyebrow">PERFORMANCE BENCHMARK</div><h2>Where does your total rank?</h2><p>Compare your PRs with recorded IPF-affiliate <strong>classic/raw full-power meet performances</strong>.</p></div></div>
<div class="ipf-overview"><div class="ipf-score"><span>IPF GL POINTS</span><strong>${s.gl===null?'—':s.gl.toFixed(2)}</strong><small>Official raw full-power formula · not a percentile</small></div><div class="ipf-score"><span>3-LIFT TOTAL</span><strong>${fmt(fromLb(total),unit()==='kg'?1:0)} <em>${unit()}</em></strong><small>${p.sample?'Sample PRs · replace with your lifts':'Based on saved PRs'}</small></div><div class="ipf-score"><span>IPF WEIGHT CLASS</span><strong class="ipf-division">${hasProfile?`${escapeHtml(s.weightClass)} · ${p.sex==='M'?'Men':'Women'}`:'Set age and weight'}</strong><small>${hasProfile?`<b>Your bodyweight: ${s.kg.toFixed(1)} kg</b><br/>Class range: ${escapeHtml(ipfClassRange(s.kg,p.sex,Number(p.age)))}<br/>${escapeHtml(s.ageGroup)}`:'Edit profile to enter age and bodyweight'}</small></div></div>
${hasProfile?`<div class="ipf-ranking"><div class="ipf-ranking-title"><strong>Competition result percentiles</strong><span>${s.cohort?'Based on imported OpenIPF results':'Import meet results to unlock'}</span></div><p class="ipf-cohort-note">Comparison group: ${p.sex==='M'?'men':'women'} in the ${escapeHtml(s.weightClass)} class (${escapeHtml(ipfClassRange(s.kg,p.sex,Number(p.age)))}) and ${escapeHtml(s.ageGroup)} division. You weigh ${s.kg.toFixed(1)} kg; competitors do not all weigh exactly the same.</p>${rankingRow('Squat','squat',pr.squat,s.cohort)}${rankingRow('Bench','bench',pr.bench,s.cohort)}${rankingRow('Deadlift','deadlift',pr.deadlift,s.cohort)}${rankingRow('Total','total',total,s.cohort)}</div>`:`<div class="ipf-no-data">${icon('info')} Add your <strong>age, bodyweight, and competition sex category</strong> to determine your IPF age and weight divisions.</div>`}
<div class="ipf-footer"><p>${ipfReference?`<strong>Results imported:</strong> ${fmt(ipfReference.eligible)} eligible meet performances · ${new Date(ipfReference.importedAt).toLocaleDateString()}. ${hasProfile&&!s.cohort?'Your selected cohort has no matching results.':''}`:'<strong>No reference results loaded.</strong> An empirical percentile needs competition data; GL points alone cannot determine one.'}<br/>Unofficial percentile of <em>meet performances</em>, not an IPF-published rank, not unique lifters, and not a gym-lifter population percentile. Gym PRs may not satisfy meet standards.</p><button class="button button-primary" data-action="ipf-import">${icon('upload')} ${ipfReference?'Update OpenIPF data':'Load OpenIPF results'}</button></div></section>`;}
// The reference is a compact histogram aggregate, not an athlete-name database.
async function processOpenIPF(file){if(!file.name.toLowerCase().endsWith('.csv'))throw Error('Unzip the OpenIPF download and select the .csv file.');if(file.size>1_000_000_000)throw Error('CSV exceeds the 1 GB upload limit.');const required=['Sex','Event','Equipment','Age','BodyweightKg','Best3SquatKg','Best3BenchKg','Best3DeadliftKg','TotalKg','Date','ParentFederation'];let ix=null,seen=0,eligible=0,cohorts={},buffer='',processed=0;
 const bump=(key,lift,kg)=>{if(!(kg>0)||kg>1500)return;const c=cohorts[key]||(cohorts[key]={});const item=c[lift]||(c[lift]={n:0,hist:{}});const bin=Math.round(kg/2.5);item.hist[bin]=(item.hist[bin]||0)+1;item.n++;};
 const processLine=(line)=>{if(!line.trim())return;const row=line.replace(/\r$/,'').split(',');if(!ix){const cols=row.map(x=>x.replace(/^"|"$/g,''));if(!required.every(k=>cols.includes(k)))throw Error('This CSV is missing required OpenIPF columns.');ix=Object.fromEntries(cols.map((c,i)=>[c,i]));return;}seen++;if(row[ix.Equipment]!=='Raw'||row[ix.Event]!=='SBD'||!['M','F'].includes(row[ix.Sex]))return;const parent=row[ix.ParentFederation];if(parent!=='IPF'&&row[ix.Federation]!=='IPF')return;if(row[ix.Date]<'2021-01-01')return;const age=Number(row[ix.Age]),kg=Number(row[ix.BodyweightKg]),key=ipfCohortKey(row[ix.Sex],age,kg);if(!key)return;const vals=['squat','bench','deadlift','total'].map((lift,i)=>Number(row[ix[['Best3SquatKg','Best3BenchKg','Best3DeadliftKg','TotalKg'][i]]]));if(!vals.some(n=>n>0))return;eligible++;['squat','bench','deadlift','total'].forEach((lift,i)=>bump(key,lift,vals[i]));};
 const reader=file.stream().getReader(),decoder=new TextDecoder();try{while(true){const {value,done}=await reader.read();if(done)break;processed+=value.byteLength;buffer+=decoder.decode(value,{stream:true});let split;while((split=buffer.indexOf('\n'))!==-1){processLine(buffer.slice(0,split));buffer=buffer.slice(split+1);}if(processed%(4*1024*1024)<value.byteLength){const el=document.getElementById('ipfImportProgress');if(el)el.textContent=`Reading records… ${Math.min(100,Math.round(processed/file.size*100))}%`;await new Promise(resolve=>setTimeout(resolve,0));}}buffer+=decoder.decode();if(buffer.trim())processLine(buffer);}finally{reader.releaseLock();}
 if(!ix||!eligible)throw Error('No eligible IPF-affiliate raw full-power results found. Check that you imported the OpenIPF CSV.');for(const c of Object.values(cohorts)){for(const v of Object.values(c))v.hist=Object.entries(v.hist).map(([bin,n])=>[Number(bin),n]).sort((a,b)=>a[0]-b[0]);}const result={version:1,importedAt:Date.now(),sourceName:file.name,rows:seen,eligible,cohorts};try{localStorage.setItem(IPF_DATA_KEY,JSON.stringify(result));}catch{throw Error('Not enough local browser storage for this reference data. Try clearing old browser data.');}ipfReference=result;return result;}
function ipfImportDialog(){modal(`<div class="modal-header"><div><div class="eyebrow">REAL MEET-DATA COMPARISON</div><h2>Load OpenIPF results</h2><p>Import results once to calculate actual competition-result percentiles by age division, bodyweight class, and sex.</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="ipf-instructions"><div><b>1.</b> <a href="${IPF_SOURCE}" target="_blank" rel="noopener noreferrer">Download OpenIPF results (.zip) ↗</a></div><div><b>2.</b> Unzip the download on your device, then select the <strong>.csv</strong> file below.</div><div><b>3.</b> LiftLab reads it locally and saves only aggregated distributions—never athlete names.</div></div><div class="field"><label for="ipfDataFile">OpenIPF CSV file</label><input class="input" id="ipfDataFile" type="file" accept=".csv,text/csv"/></div><p id="ipfImportProgress" class="input-help" role="status" style="margin-top:13px">Only raw, full-power IPF-affiliate meet performances from 2021 onward are included. Results can take a moment to process.</p><div class="form-actions"><button class="button button-secondary" data-action="close-modal">Cancel</button><button class="button button-primary" id="ipfImportButton" data-action="ipf-upload">${icon('upload')} Calculate percentile reference</button></div><p class="input-help">Percentiles are unofficial. Multiple meet results from one competitor can appear, so the sample is meet performances, not unique athletes. Score entries are compared using IPF bodyweight classes and age groups. At least 30 observations are required for a displayed percentile. Source: OpenPowerlifting / OpenIPF.</p>`,true);}

const defaultState=()=>({profile:{name:'Athlete',experience:'Intermediate',goal:'Build strength',days:4,unit:'lb',age:null,bodyweightLb:null,sex:'',sample:true,prs:{squat:315,bench:245,deadlift:385,ohp:135}},active:null,logs:[]});
// Prefer durable storage. Some preview/sandbox browsers disable it; preserve changes for this
// tab with sessionStorage when possible and never claim a durable save unless verified.
function storageWritable(kind){try{const storage=globalThis[kind];const key='liftlab-storage-check';storage.setItem(key,'ok');const works=storage.getItem(key)==='ok';storage.removeItem(key);return works;}catch{return false;}}
let storageMode=storageWritable('localStorage')?'local':storageWritable('sessionStorage')?'session':'none';
function readState(){try{const raw=(storageMode==='local'?localStorage.getItem(STORAGE_KEY):null)||((storageMode!=='none')?sessionStorage.getItem(STORAGE_KEY):null);if(!raw)return defaultState();const input=JSON.parse(raw),base=defaultState();if(!input||typeof input!=='object')return base;return {...base,...input,profile:{...base.profile,...input.profile,prs:{...base.profile.prs,...(input.profile?.prs||{})}},logs:Array.isArray(input.logs)?input.logs.filter(x=>x&&Array.isArray(x.sets)):[]};}catch(err){return defaultState();}}
let state=readState();
let ipfReference=ipfReferenceLoad();
let ipfUploadBusy=false;
function updateStorageStatus(){const label=document.getElementById('storageBadgeText'),badge=document.getElementById('storageBadge');if(!label)return;label.textContent=storageMode==='local'?'SAVED LOCALLY':storageMode==='session'?'TAB ONLY · EXPORT BACKUP':'NOT SAVED · EXPORT BACKUP';badge?.classList.toggle('storage-warning',storageMode!=='local');badge.title=storageMode==='local'?'Your changes are stored in this browser.':storageMode==='session'?'Changes survive reloads in this tab, but may disappear when the tab closes. Export a backup.':'This preview blocks browser storage. Changes last only until this page reloads. Export your backup.';}
function persist(){const data=JSON.stringify(state);try{localStorage.setItem(STORAGE_KEY,data);if(localStorage.getItem(STORAGE_KEY)!==data)throw Error('Storage verification failed');storageMode='local';updateStorageStatus();return 'local';}catch{}try{sessionStorage.setItem(STORAGE_KEY,data);if(sessionStorage.getItem(STORAGE_KEY)!==data)throw Error('Session storage verification failed');storageMode='session';updateStorageStatus();return 'session';}catch{}storageMode='none';updateStorageStatus();return 'none';}
function saveFeedback(mode){if(mode==='local')notify('Profile updated and saved.');else if(mode==='session')notify('Profile changed for this tab. Export a backup to keep it permanently.',true);else notify('Profile changed, but browser storage is blocked. Export a backup before leaving.',true);}
function profileError(message,field){const box=document.getElementById('profileFormError');if(box){box.hidden=false;box.textContent=message;box.scrollIntoView({block:'nearest',behavior:'smooth'});}if(field){const input=document.getElementById(field);if(input){input.setAttribute('aria-invalid','true');input.focus({preventScroll:true});}}}
function notify(msg,error=false){const holder=document.getElementById('toastRoot');const div=document.createElement('div');div.className='toast'+(error?' error':'');div.textContent=msg;holder.append(div);setTimeout(()=>div.remove(),3700);}
const unit=()=>state.profile.unit==='kg'?'kg':'lb';
const fromLb=n=>unit()==='kg'?n/2.2046226218:n;
const toLb=n=>unit()==='kg'?n*2.2046226218:n;
const showLoad=n=>n==null||!Number.isFinite(n)?'—':`${fmt(fromLb(n),unit()==='kg'?1:0)} ${unit()}`;
const showVolume=n=>`${fmt(Math.round(fromLb(n)))} ${unit()}`;
function liftMax(key){const v=Number(state.profile.prs[key]);return Number.isFinite(v)&&v>0?v:0;}
function recommendedLoad(key,pct){const m=liftMax(key);if(!m)return null;const raw=fromLb(m)*pct;const increment=unit()==='kg'?2.5:5;return toLb(Math.max(increment,Math.round(raw/increment)*increment));}

// These are original, reduced-complexity demo templates based on publicly described training philosophies.

const findProgram=id=>programs.find(p=>p.id===id);
function programDay(p,week,index){
 if(['stronglifts','starting'].includes(p.id))return p.daysData[((week-1)*p.days+index)%2];
 if(p.id==='smolov'){
  const base=p.daysData[index], recovery={name:'Recovery / technique',ex:[['Bodyweight squat',null,2,10],['Bird dog',null,2,10]]};
  if(week<=2)return index===3?recovery:{name:`Intro squat ${index+1}`,ex:[['Back squat','squat',3,week===1?6:5]]};
  if(week<=5)return {name:['Base — Volume 4×9','Base — Volume 5×7','Base — Heavy 7×5','Base — Heavy 10×3'][index],ex:[['Back squat','squat',...[[4,9],[5,7],[7,5],[10,3]][index]]]};
  if(week===6)return index===3?recovery:{name:`Recovery squat ${index+1}`,ex:[['Back squat','squat',2,5]]};
  if(week<=8)return index===3?recovery:{name:`Switching — Technique ${index+1}`,ex:[['Speed squat','squat',3,3]]};
  if(week<=12)return index===3?recovery:{name:`Intensity squat ${index+1}`,ex:[['Back squat','squat',3,week<=10?4:3]]};
  return index===3?recovery:{name:`Taper squat ${index+1}`,ex:[['Back squat','squat',2,3]]};
 }
 return p.daysData[index%p.days];
}
function makeSets(p,week,dayIndex){

 return day.ex.map(([name,lift,sets=3,reps=10,repsUnit],idx)=>{
  if(p.id==='smolovjr'&&idx===0&&lift){

   const suggested=recommendedLoad(lift,pct);const load=suggested===null?null:suggested+extraLb;
   return {name,lift,sets:Array.from({length:sets},()=>({targetReps:reps,reps,weight:load,done:false,caption:`${Math.round(pct*100)}% 1RM${extraLb?` + ${extraLb} lb sample`:''}`}))};
  }
  if(p.id==='smolov'&&lift){
   let pct=.55;
   if(week<=2)pct=.55+.025*(week-1)+.025*dayIndex;
   else if(week<=5)pct=[.70,.75,.80,.85][dayIndex];
   else if(week===6)pct=.55;
   else if(week<=8)pct=.50+.025*dayIndex;
   else if(week<=12)pct=Math.min(.88,.72+.025*(week-9)+.03*dayIndex);
   else pct=.55+.05*dayIndex;
   return {name,lift,sets:Array.from({length:sets},()=>({targetReps:reps,reps,weight:recommendedLoad(lift,pct),done:false,caption:`${Math.round(pct*100)}% 1RM · sample`}))};
  }
  if(p.id==='magort'&&idx===0&&lift){
   const bump=Math.min(.06,(week-1)*.005),seq=[...Array(4).fill([4,.70+bump]),[2,.80+bump],[2,.90+bump],[8,.70+bump]];
   return {name,lift,sets:seq.map(([r,pct],i)=>({targetReps:r,reps:r,weight:recommendedLoad(lift,pct),done:false,caption:i===6?'8+ target · repeat if missed':`${Math.round(pct*100)}% 1RM · sample`}))};
  }
  if(p.id==='wendler'&&idx===0&&lift){return {name,lift,sets:wave.map((pct,i)=>({targetReps:wReps[i],weight:recommendedLoad(lift,pct*.9),reps:wReps[i],done:false,caption:`${Math.round(pct*100)}% TM${i===2&&week<4?' · +' :''}`}))};}

  if(['stronglifts','starting'].includes(p.id)&&lift){const pct=Math.min(.78,.60+(week-1)*.02);return {name,lift,sets:Array.from({length:sets},()=>({targetReps:reps,reps,weight:recommendedLoad(lift,pct),done:false,caption:'Conservative guide · adjust'}))};}
  if(p.id==='madcow'&&lift){const top=Math.min(.88,.75+(week-1)*.015)*(dayIndex===1?.86:dayIndex===2?.96:1);return {name,lift,sets:Array.from({length:sets},(_,i)=>({targetReps:reps,reps,weight:recommendedLoad(lift,top*(.60+.4*i/Math.max(1,sets-1))),done:false,caption:i===sets-1?'Working top set':'Ramped set'}))};}
  if(p.id==='candito'&&lift){const adjustedReps=week===5?Math.min(reps,3):week===6?Math.min(reps,5):reps;return {name,lift,sets:Array.from({length:sets},()=>({targetReps:adjustedReps,reps:adjustedReps,weight:recommendedLoad(lift,canditoPcts[clamp(week-1,0,5)]),done:false,caption:`${Math.round(canditoPcts[clamp(week-1,0,5)]*100)}% 1RM`}))};}

  return {name,lift,sets:Array.from({length:sets},()=>({targetReps:reps,reps,weight:lift?recommendedLoad(lift,pct):null,done:false,caption:repsUnit==='sec'?'seconds':'target'}))};
 });
}

// Dashboard card order is intentionally independent of workout data, so layout edits cannot overwrite PRs.
const DASHBOARD_LAYOUT_KEY='liftlab-home-order-v1';
const DASHBOARD_IDS=['records','rankings','training','progress'];
const DASHBOARD_LABELS={records:'Personal records',rankings:'IPF comparison',training:'Current program',progress:'Progress & history'};
let dashboardOrderCache=null;
function getDashboardOrder(){
 if(dashboardOrderCache)return [...dashboardOrderCache];
 try{const data=JSON.parse(localStorage.getItem(DASHBOARD_LAYOUT_KEY));if(Array.isArray(data)&&data.length===4&&DASHBOARD_IDS.every(id=>data.includes(id))){dashboardOrderCache=data;return [...data];}}catch{}
 dashboardOrderCache=[...DASHBOARD_IDS];return [...dashboardOrderCache];
}
function saveDashboardOrder(order){dashboardOrderCache=[...order];try{localStorage.setItem(DASHBOARD_LAYOUT_KEY,JSON.stringify(order));if(localStorage.getItem(DASHBOARD_LAYOUT_KEY)!==JSON.stringify(order))throw Error('Storage disabled');notify('Dashboard layout saved.');}catch{notify('Layout changed, but this browser may not remember it after closing.',true);}}
function moveDashboardBlock(source,target){
 const order=getDashboardOrder();if(!order.includes(source)||!order.includes(target)||source===target)return;
 const sourceIndex=order.indexOf(source),targetIndex=order.indexOf(target);
 order.splice(sourceIndex,1);order.splice(targetIndex,0,source);saveDashboardOrder(order);
 // Preserve current input values and chart selection during layout changes by moving live DOM nodes.
 applyDashboardOrder(order);
}
function applyDashboardOrder(order){
 const layout=document.getElementById('dashboardLayout');if(!layout)return;
 for(const id of order){const node=layout.querySelector(`[data-dashboard-block="${id}"]`);if(node)layout.appendChild(node);}
 for(const [i,id] of order.entries()){
  const block=layout.querySelector(`[data-dashboard-block="${id}"]`);if(!block)continue;
  block.querySelector('[data-dashboard-up]').disabled=i===0;
  block.querySelector('[data-dashboard-down]').disabled=i===order.length-1;
 }
}
function setupDashboardLayout(){
 const root=app().querySelector('.main-content');if(!root||document.getElementById('dashboardLayout'))return;
 const pr=root.querySelector('.pr-editor'),ipf=root.querySelector('.ipf-panel'),progress=root.querySelector('#home-progress');
 const trainingHeader=Array.from(root.children).find(el=>el.classList?.contains('section-heading')&&el.textContent.includes('Training cockpit'));
 const trainingCard=trainingHeader?.nextElementSibling;
 if(!pr||!ipf||!progress||!trainingHeader||!trainingCard)return;
 const controls=document.createElement('div');controls.className='dashboard-layout-controls';
 controls.innerHTML='<p><strong>Customize dashboard</strong> · Drag a section by its handle, or use ↑ ↓ to reorder it.</p><button id="resetDashboardOrder" type="button">Reset layout</button>';
 const layout=document.createElement('div');layout.id='dashboardLayout';layout.className='dashboard-layout';
 pr.before(controls);controls.after(layout);
 const elements={records:[pr],rankings:[ipf],training:[trainingHeader,trainingCard],progress:[progress]};
 for(const id of DASHBOARD_IDS){
  const block=document.createElement('section');block.className='dashboard-block';block.dataset.dashboardBlock=id;
  const bar=document.createElement('div');bar.className='dashboard-block-bar';
  const title=document.createElement('span');title.className='dashboard-block-name';title.textContent=DASHBOARD_LABELS[id];
  const actions=document.createElement('div');actions.className='dashboard-block-actions';
  const grip=document.createElement('button');grip.type='button';grip.className='drag-grip';grip.draggable=true;grip.textContent='⠿ Drag';grip.setAttribute('aria-label',`Drag ${DASHBOARD_LABELS[id]} section to reorder`);
  const up=document.createElement('button');up.type='button';up.textContent='↑';up.dataset.dashboardUp=id;up.setAttribute('aria-label',`Move ${DASHBOARD_LABELS[id]} up`);
  const down=document.createElement('button');down.type='button';down.textContent='↓';down.dataset.dashboardDown=id;down.setAttribute('aria-label',`Move ${DASHBOARD_LABELS[id]} down`);
  actions.append(grip,up,down);bar.append(title,actions);block.append(bar,...elements[id]);layout.append(block);
  grip.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';block.classList.add('dragging');});
  grip.addEventListener('dragend',()=>{block.classList.remove('dragging');layout.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));});
  block.addEventListener('dragover',e=>{if(!e.dataTransfer.types.includes('text/plain'))return;e.preventDefault();e.dataTransfer.dropEffect='move';block.classList.add('drag-over');});
  block.addEventListener('dragleave',e=>{if(!block.contains(e.relatedTarget))block.classList.remove('drag-over');});
  block.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();block.classList.remove('drag-over');const source=e.dataTransfer.getData('text/plain');moveDashboardBlock(source,id);});
  up.addEventListener('click',()=>{const order=getDashboardOrder(),i=order.indexOf(id);if(i>0)moveDashboardBlock(id,order[i-1]);});
  down.addEventListener('click',()=>{const order=getDashboardOrder(),i=order.indexOf(id);if(i>=0&&i<order.length-1)moveDashboardBlock(id,order[i+1]);});
 }
 controls.querySelector('#resetDashboardOrder').addEventListener('click',()=>{saveDashboardOrder([...DASHBOARD_IDS]);applyDashboardOrder(DASHBOARD_IDS);});
 applyDashboardOrder(getDashboardOrder());
}

function renderHomeProgress(){const logs=[...state.logs].sort((a,b)=>a.created-b.created),sessions=logs.length,vol=logs.reduce((s,l)=>s+totalVolume(l),0),sets=logs.reduce((s,l)=>s+l.sets.length,0);return `<section id="home-progress" class="home-progress"><div class="head-row"><div><div class="eyebrow">METRICS THAT MATTER</div><h2 class="progress-heading">Progress <span style="color:var(--red)">& performance.</span></h2><div class="page-subtitle">Your numbers, workout history, and consistency—right here on Home.</div></div></div><div class="metric-row"><div class="metric panel"><div class="label">WORKOUTS</div><strong>${sessions}</strong><small>Completed sessions</small></div><div class="metric panel"><div class="label">TOTAL VOLUME</div><strong>${fmt(Math.round(fromLb(vol)))}</strong><small>${unit()} lifted</small></div><div class="metric panel"><div class="label">TOTAL SETS</div><strong>${sets}</strong><small>Completed sets</small></div></div>

function chooseProgram(id){const p=findProgram(id);if(!p)return;if(state.active&&state.active.sessionIndex<p.days*p.weeks){modal(`<div class="modal-header"><div><div class="eyebrow">CHANGE PROGRAM</div><h2>Replace current program?</h2><p>Starting ${escapeHtml(p.name)} will replace your current program position. Past workout logs will be kept.</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="form-actions"><button class="button button-secondary" data-action="close-modal">Cancel</button><button class="button button-primary" data-action="confirm-start" data-id="${id}">Start program</button></div>`);}else confirmStart(id);}

function openLogger(){if(!state.active){notify('Choose a program first.',true);return;}const p=findProgram(state.active.programId);if(!p)return;const index=state.active.sessionIndex,max=p.weeks*p.days;if(index>=max){notify('This program block is complete. Start it again to continue.',true);return;}const week=Math.floor(index/p.days)+1,dayIdx=index%p.days,day=programDay(p,week,dayIdx);logDraft={week,dayIdx,programId:p.id,exercises:makeSets(p,week,dayIdx)};renderLogger();}

 <form id="logForm">${logDraft.exercises.map((ex,eIndex)=>`<div class="log-block"><div class="log-title"><strong>${escapeHtml(ex.name)}</strong><small>${ex.sets.length} sets · ${ex.sets[0]?.caption||'working'}</small></div><table class="log-table"><thead><tr><th>SET</th><th>WEIGHT (${unit()})</th><th>REPS</th><th>DONE</th></tr></thead><tbody>${ex.sets.map((s,i)=>`<tr id="row-${eIndex}-${i}"><td>${i+1}</td><td><input aria-label="${escapeHtml(ex.name)} set ${i+1} weight" data-logex="${eIndex}" data-logset="${i}" data-logfield="weight" type="number" min="0" max="5000" step="any" placeholder="${s.weight==null?'Add weight':''}" value="${s.weight==null?'':Number(fromLb(s.weight).toFixed(1))}" /></td><td><input aria-label="${escapeHtml(ex.name)} set ${i+1} reps" data-logex="${eIndex}" data-logset="${i}" data-logfield="reps" type="number" min="1" max="100" step="1" value="${s.reps}" /></td><td><input class="set-check" aria-label="${escapeHtml(ex.name)} set ${i+1} complete" data-logex="${eIndex}" data-logset="${i}" data-logfield="done" type="checkbox" /></td></tr>`).join('')}</tbody></table></div>`).join('')}<div class="form-actions"><button type="button" class="button button-secondary" data-action="close-modal">Cancel</button><button class="button button-primary" type="submit">${icon('check')} Finish workout</button></div></form>`,true);}
function saveLog(){if(!logDraft)return;const p=findProgram(logDraft.programId);let sets=[];for(const ex of logDraft.exercises){for(const s of ex.sets){if(!s.done)continue;if(!Number.isFinite(s.weight)||s.weight<0||!Number.isInteger(s.reps)||s.reps<1){notify('Check weights and reps for completed sets.',true);return;}sets.push({exercise:ex.name,lift:ex.lift,weight:s.weight,reps:s.reps});}}if(!sets.length){notify('Check at least one completed set to finish.',true);return;}const l={id:`${Date.now()}-${Math.random().toString(36).slice(2,6)}`,created:Date.now(),programId:p.id,programName:p.name,dayName:programDay(p,logDraft.week,logDraft.dayIdx).name,week:logDraft.week,sets};state.logs.push(l);if(state.active?.programId===p.id)state.active.sessionIndex=Math.min(state.active.sessionIndex+1,p.weeks*p.days);let prs=[];for(const set of sets){if(set.lift&&set.reps===1&&set.weight>liftMax(set.lift)){state.profile.prs[set.lift]=set.weight;prs.push(PR_NAMES[set.lift]);}}persist();closeModal();render();notify(prs.length?`Workout saved! New one-rep PR: ${prs.join(', ')}.`:`Workout saved — ${sets.length} sets logged.`);}

// Explicit click and Enter paths share the same synchronous profile writer.
function saveProfileEdits(){
 const form=document.getElementById('profileForm');if(!form)return;
 const fd=new FormData(form),name=String(fd.get('name')||'').trim();
  if(!name){profileError('Enter your display name to save.','profileName');return;}
  const chosenUnit=String(fd.get('unit'));const newPrs={};
  for(const key of Object.keys(PR_NAMES)){
   const raw=String(fd.get(`pr_${key}`)??'').trim(),val=Number(raw);
   if(!raw||!Number.isFinite(val)||val<0||val>5000){profileError(`${PR_NAMES[key]} must be a number between 0 and 5,000.`,`pr_${key}`);return;}
   newPrs[key]=chosenUnit==='kg'?val*LB_PER_KG:val;
  }
  const ageText=String(fd.get('age')||'').trim(),bwText=String(fd.get('bodyweight')||'').trim();
  const age=ageText?Number(ageText):null,bw=bwText?Number(bwText):null,sex=String(fd.get('sex')||'');
  if(age!==null&&(!Number.isInteger(age)||age<14||age>100)){profileError('Enter a whole-number age between 14 and 100, or leave age blank.','profileAge');return;}
  if(bw!==null&&(!Number.isFinite(bw)||bw<20||bw>1400)){profileError('Enter bodyweight between 20 and 1,400 in your selected unit, or leave it blank.','profileBodyweight');return;}
  if(!['M','F',''].includes(sex)){profileError('Choose a valid competition category.','profileSex');return;}
  state.profile={...state.profile,name,experience:String(fd.get('experience')),goal:String(fd.get('goal')),days:Number(fd.get('days')),unit:chosenUnit,age,bodyweightLb:bw===null?null:chosenUnit==='kg'?bw*LB_PER_KG:bw,sex,sample:false,prs:newPrs};
  const saved=persist();closeModal();render();saveFeedback(saved);return;
}

function showQuickPRError(message, key){
 const feedback=document.getElementById('prSaveError');if(feedback){feedback.hidden=false;feedback.textContent=message;}
 if(key)document.getElementById('home_pr_'+key)?.focus();
}
function saveQuickPRs(){
 const next={...state.profile.prs};
 for(const key of ['squat','bench','deadlift']){
  const input=document.getElementById('home_pr_'+key);
  if(!input)return;
  const raw=input.value.trim(),n=Number(raw);
  if(!raw||!Number.isFinite(n)||n<0||n>5000){showQuickPRError(`Enter a valid ${PR_NAMES[key]} record between 0 and 5,000 ${unit()}.`,key);return;}
  next[key]=unit()==='kg'?n*LB_PER_KG:n;
 }
 state.profile.prs=next;
 state.profile.sample=false;
 const saved=persist();
 render();
 saveFeedback(saved);
 const notice=document.getElementById('prSaveStatus');
 if(notice)notice.textContent=saved==='local'?'PRs updated and saved to this browser.':saved==='session'?'PRs updated (this tab only). Export a backup.':'PRs updated, but this preview blocks storage. Export a backup.';
}
// Single delegated event layer keeps dynamically re-rendered screens and dialogs interactive.
document.addEventListener('click',async event=>{
 const btn=event.target.closest('[data-action],[data-nav]');if(!btn)return;
 if(btn.dataset.nav){if(btn.dataset.nav==='progress'){goto('home');document.getElementById('home-progress')?.scrollIntoView({behavior:'smooth'});}else goto(btn.dataset.nav);return;}
 const a=btn.dataset.action;
 if(a==='close-outside'){if(event.target===btn)closeModal();return;}
 if(a==='close-modal'){closeModal();return;}
 if(a==='edit-profile'){editProfile();return;}
 if(a==='save-profile'){event.preventDefault();saveProfileEdits();return;}
 if(a==='save-prs'){event.preventDefault();saveQuickPRs();return;}
 if(a==='ipf-import'){ipfImportDialog();return;}
 if(a==='ipf-upload'){if(ipfUploadBusy)return;const file=document.getElementById('ipfDataFile')?.files?.[0];if(!file){notify('Choose an unzipped OpenIPF CSV first.',true);return;}ipfUploadBusy=true;const b=document.getElementById('ipfImportButton');b.disabled=true;try{const data=await processOpenIPF(file);closeModal();render();notify(`Imported ${fmt(data.eligible)} IPF-affiliate meet performances.`);}catch(err){const el=document.getElementById('ipfImportProgress');if(el)el.textContent=err.message;notify(err.message,true);}finally{ipfUploadBusy=false;const btn=document.getElementById('ipfImportButton');if(btn)btn.disabled=false;}return;}
 if(a==='quiz'){openQuiz();return;}
 if(a==='quiz-restart'){openQuiz();return;}
 if(a==='quiz-prev'){quizStep=Math.max(0,quizStep-1);renderQuiz();return;}
 if(a==='quiz-choice'){quizAnswers[['goal','skill','days'][quizStep]]=btn.dataset.value;quizStep++;renderQuiz();return;}
 if(a==='quiz-browse'){const target=btn.dataset.type;closeModal();goto(target);return;}
 if(a==='quiz-open-program'){closeModal();view=findProgram(btn.dataset.id).type;selectedProgram=btn.dataset.id;detailDay=0;detailWeek=1;render();window.scrollTo({top:0});return;}
 if(a==='open-program'){selectedProgram=btn.dataset.id;detailDay=0;detailWeek=1;render();window.scrollTo({top:0});return;}
 if(a==='back-catalog'){selectedProgram=null;render();return;}
 if(a==='filter'){filter=btn.dataset.filter;render();return;}
 if(a==='day-tab'){detailDay=Number(btn.dataset.day);render();return;}
 if(a==='start-program'){chooseProgram(btn.dataset.id);return;}
 if(a==='confirm-start'){confirmStart(btn.dataset.id);return;}
 if(a==='log'){openLogger();return;}
 if(a==='browse'){goto('powerlifting');return;}
 if(a==='scroll-progress'){document.getElementById('home-progress')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(a==='chart-mode'){chartMode=btn.dataset.mode;render();return;}
 if(a==='export'){exportState();return;}
 if(a==='import'){importDialog();return;}
 if(a==='reset'){resetDialog();return;}
 if(a==='confirm-reset'){state=defaultState();ipfReference=null;try{localStorage.removeItem(IPF_DATA_KEY);}catch{}persist();closeModal();goto('home');notify('All local data was reset.');return;}
});
document.addEventListener('change',e=>{
 if(e.target.id==='detailWeek'){detailWeek=Number(e.target.value);render();return;}
 if(e.target.id==='profileUnit'){
  // Convert only the currently edited numbers; saved values do not change until form submit.
  const newUnit=e.target.value,oldUnit=e.target.dataset.prev||unit();if(oldUnit===newUnit)return;
  document.querySelectorAll('.pr-input,.weight-input').forEach(el=>{if(el.value.trim()==='')return;const n=Number(el.value);el.value=Number((oldUnit==='lb'&&newUnit==='kg'?n/2.2046226218:n*2.2046226218).toFixed(1));});
  e.target.dataset.prev=newUnit;document.querySelectorAll('.editUnitBadge').forEach(el=>el.textContent=newUnit);
 }
 if(e.target.dataset.logfield==='done'&&logDraft){const ex=Number(e.target.dataset.logex),set=Number(e.target.dataset.logset);logDraft.exercises[ex].sets[set].done=e.target.checked;e.target.closest('tr').classList.toggle('is-done',e.target.checked);}
});
document.addEventListener('input',e=>{
 if(!logDraft||!e.target.dataset.logfield||e.target.dataset.logfield==='done')return;
 const el=e.target,ex=Number(el.dataset.logex),set=Number(el.dataset.logset),field=el.dataset.logfield;
 if(field==='weight')logDraft.exercises[ex].sets[set].weight=el.value.trim()===''?null:toLb(Number(el.value));
 if(field==='reps')logDraft.exercises[ex].sets[set].reps=el.value.trim()===''?NaN:Number(el.value);
});
document.addEventListener('submit',async event=>{
 if(event.target.id==='quickPrForm'){event.preventDefault();saveQuickPRs();return;}
 if(event.target.id==='profileForm'){event.preventDefault();saveProfileEdits();return;}
 if(event.target.id==='logForm'){event.preventDefault();saveLog();return;}
 if(event.target.id==='importForm'){event.preventDefault();const file=document.getElementById('importFile').files?.[0];if(!file||file.size>15_000_000){notify('Choose a JSON backup under 15 MB.',true);return;}const submit=event.target.querySelector('[type="submit"]');submit.disabled=true;submit.textContent='Importing…';try{const data=JSON.parse(await file.text());if(data.app!=='LiftLab'||data.version!==1||!validBackup(data.state))throw Error('Invalid LiftLab backup.');state=data.state;persist();closeModal();goto('home');notify('Backup imported successfully.');}catch{submit.disabled=false;submit.textContent='Import backup';notify('Could not import: invalid or unsupported backup.',true);}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalRoot').innerHTML)closeModal();});
// Horizontal gesture navigation. Directions intentionally follow the user's requested mapping:
// swipe LEFT from home => powerlifting; swipe RIGHT from home => bodybuilding.
let touchStart=null;
app().addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,select,a,.day-tabs'))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
app().addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)<80||Math.abs(dx)<Math.abs(dy)*1.5||document.getElementById('modalRoot').innerHTML)return;if(view==='home'){goto(dx<0?'powerlifting':'bodybuilding');}else if(view==='powerlifting'&&dx>0)goto('home');else if(view==='bodybuilding'&&dx<0)goto('home');},{passive:true});
installIcons();render();

</script>
</body>
